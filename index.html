<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Meal Planner</title>
    <meta name="theme-color" content="#1f5f3a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="hero">
            <div class="hero-copy">
                <span class="eyebrow">Weekly food board</span>
                <h1>🍽️ This Week's Dinners</h1>
                <p class="subtitle">Clean, sale-aware meals for the family — fast enough for real weeknights.</p>
                <p class="week-info" id="weekInfo"></p>
            </div>
            <div class="hero-card" aria-label="Planner summary">
                <span class="hero-card-label">Selected meals</span>
                <strong id="selectedCount">0</strong>
                <span id="selectedCost">$0 planned</span>
            </div>
        </header>

        <section class="deal-board" id="dealBoard" aria-label="Best weekly deals"></section>

        <div class="filters" aria-label="Meal filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="selected">Selected</button>
            <button class="filter-btn" data-filter="chicken">🐔 Chicken</button>
            <button class="filter-btn" data-filter="turkey">🦃 Turkey</button>
            <button class="filter-btn" data-filter="beef">🥩 Beef</button>
            <button class="filter-btn" data-filter="pork">🐷 Pork</button>
            <button class="filter-btn" data-filter="seafood">🐟 Seafood</button>
        </div>

        <div class="meals-grid" id="mealsGrid">
            <!-- Meals loaded dynamically -->
        </div>

        <div class="shopping-list-section">
            <div class="shopping-list-header">
                <h2>🛒 Shopping List</h2>
                <button id="copyListBtn" class="copy-btn" onclick="copyShoppingList()">📋 Copy List</button>
            </div>
            <div id="shoppingList" class="shopping-list">
                <p class="empty-state">Select meals above to build your shopping list</p>
            </div>
            <div id="copyFeedback" class="copy-feedback"></div>
        </div>

        <footer>
            <p>Prices from Harris Teeter & Aldi in Belmont, NC</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
